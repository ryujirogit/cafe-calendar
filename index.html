<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cafe Calendar</title><style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f7f5f0;color:#252525;margin:0;padding:20px}main{max-width:560px;margin:auto}h1{font-size:25px}header{display:flex;align-items:center;justify-content:space-between}button{cursor:pointer;border:0;border-radius:12px;padding:12px;background:#e9e5dd;font-size:16px}.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.week{text-align:center;margin:20px 0 8px;font-size:12px}.day{min-height:76px;background:white;border:1px solid #e6e2dc;border-radius:10px;padding:5px;text-align:left;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px}.day span{align-self:flex-start}.day strong{font-size:10px;text-align:center;overflow-wrap:anywhere}.empty{background:transparent;border:0}.sheet{position:fixed;inset:0;background:#0006;display:none;align-items:end;justify-content:center}.sheet.show{display:flex}.panel{background:white;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:24px;display:grid;gap:12px}.panel button{padding:17px}.hint{color:#666;font-size:13px}
</style></head><body><main><h1>☕ Cafe Calendar</h1><header><button id="prev">‹</button><h2 id="month"></h2><button id="next">›</button></header><div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div id="grid" class="grid"></div><p class="hint">日付をタップして、行ったカフェを記録できます。記録はこのブラウザに保存されます。</p></main><div id="sheet" class="sheet"><div class="panel"><h3 id="chosen"></h3><button data-cafe="starbucks">🟢 スターバックス</button><button data-cafe="tullys">🟠 タリーズ</button><button data-cafe="delete">記録を削除</button><button id="cancel">キャンセル</button></div></div><script>
const now=new Date();let year=now.getFullYear(),month=now.getMonth(),selected='';const grid=document.querySelector('#grid'),sheet=document.querySelector('#sheet');let records={};try{records=JSON.parse(localStorage.getItem('cafeRecords')||'{}')}catch{}
function render(){document.querySelector('#month').textContent=`${year}年${month+1}月`;grid.innerHTML='';let start=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();for(let i=0;i<start;i++){let e=document.createElement('div');e.className='empty';grid.append(e)}for(let d=1;d<=days;d++){let key=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,b=document.createElement('button');b.className='day';let s=document.createElement('span');s.textContent=d;b.append(s);if(records[key]){let label=document.createElement('strong');label.textContent=records[key]==='starbucks'?'🟢 STARBUCKS':'🟠 TULLY’S';b.append(label)}b.onclick=()=>{selected=key;document.querySelector('#chosen').textContent=`${month+1}月${d}日`;sheet.classList.add('show')};grid.append(b)}}
document.querySelector('#prev').onclick=()=>{month--;if(month<0){month=11;year--}render()};document.querySelector('#next').onclick=()=>{month++;if(month>11){month=0;year++}render()};document.querySelectorAll('[data-cafe]').forEach(b=>b.onclick=()=>{let v=b.dataset.cafe;if(v==='delete')delete records[selected];else records[selected]=v;localStorage.setItem('cafeRecords',JSON.stringify(records));sheet.classList.remove('show');render()});document.querySelector('#cancel').onclick=()=>sheet.classList.remove('show');sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('show')};render();
</script></body></html>
